<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>University Admission Form</title>
  </head>

  <body>
    <header>
      <h1>University Admission Form</h1>
      <hr />
    </header>
    <main>
      <form>
        <label for="Name">Name:</label>
        <input type="text" id="Name" name="Name" required />
        <br />
        <br />

        <label for="Email">Email:</label>
        <input type="email" id="Email" name="Email" required />
        <br />
        <br />

        <label for="Phone">Phone:</label>
        <input type="tel" id="Phone" name="Phone" required />
        <br />
        <br />

        <label for="Date-of-Birth">Date of Birth:</label>
        <input type="date" id="Date-of-Birth" name="Date-of-Birth" required />
        <br /><br />

        <label for="Degree">Degree program:</label>
        <select id="Degree" name="Degree_program" required>
          <option value="" disabled selected hidden>
            Select a degree program
          </option>
          <option value="Bachelors in Software Engineering">
            Bachelors in Software Engineering
          </option>
          <option value="Bachelors in Computer Science">
            Bachelors in Computer Science
          </option>
          <option value="Bachelors in Electrical Engineering">
            Bachelors in Electrical Engineering
          </option>
          <option value="Bachelors in Psychology">
            Bachelors in Psychology
          </option>
          <option value="Bachelors in English">Bachelors in English</option>
        </select>
        <br /><br />

        <label for="Gender">Gender: </label>
        <input type="radio" id="Male" name="Gender" value="Male" required />
        <label for="Male">Male</label>
        <input type="radio" id="Female" name="Gender" value="Female" required />
        <label for="Female">Female</label>
        <br />
        <br />

        <label for="interests">Interests:</label>
        <input type="checkbox" id="Sports" name="interests" />
        <label for="Sports">Sports</label>
        <input type="checkbox" id="Coading" name="interests" />
        <label for="Coading">Coading</label>
        <input type="checkbox" id="Gaming" name="interests" />
        <label for="Gaming">Gaming</label>
        <input type="checkbox" id="Reading" name="interests" />
        <label for="Reading">Reading</label>
        <br />
        <br />
        <br />

        <label for="user-doc">Upload-Document:</label>
        <input type="file" id="user-doc" name=" upload document" required />
        <br />
        <br />
        <br />

        <label for="personal-statement">Personal Statement:</label>
        <textarea
          id="personal-statement"
          name="personal-statement"
          rows="5"
          cols="40"
          placeholder="Write your personal statement here..."
        ></textarea>
        <br />
        <br />
        <br />
        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
