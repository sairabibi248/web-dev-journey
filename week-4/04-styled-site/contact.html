        <main>
            <br>
            <br>

            <table class="tc">
                <tr>
                    <td align="center">
                        <h2>Enroll Here</h2>
                        <br>
                        <br>
                        
                        <form action="#" method="get">
                            <p align="left">
                                <label for="name">Kid's Name:</label>
                                <input type="text" id="name" name="fullname" placeholder="Enter student's name" required>
                            </p>
                            <br>

                            <p align="left">
                                <label for="Age">Kid's Age:</label>
                                <input type="number" id="Age" name="age" placeholder="13" required>
                            </p>
                            <br>

                            <p align="left">
                                <label for="activity">Select Activity:</label>
                                <select id="activity" name="activity" required>
                                    <option value="" selected disabled>Select an activity</option>
                                    <option value="Play Sprout Zone">Play Sprout Zone</option>
                                    <option value="Kidventure Outdoor">Kidventure Outdoor</option>
                                    <option value="Sportigo Zone">Sportigo Zone</option>
                                    <option value="Campfinity">Campfinity</option>
                                    <option value="Turbo MindCrafters">Turbo MindCrafters</option>
                                    <option value="Wonder Lab">Wonder Lab</option>
                                    <option value="All">All</option>
                                </select>
                            </p>
                            <br>

                            <p align="left">
                                <label for="number">Parent's Phone Number:</label>
                                <input type="tel" id="number" name="phone" placeholder="03XXXXXXXXX" required>
                            </p>
                            <br>
                            <br>


                            <p class="submit" align="center">
                                <input type="submit" value="Submit Booking Request">
                            </p>
                            <br>
                            <br>
                        </form>
                    </td>
                </tr>
            </table>
